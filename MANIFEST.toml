name = "Preferred Cover Art"
description = "Select front Cover Art Archive artwork from a preferred MusicBrainz release."
long_description = """
Uses a recording MBID to discover MusicBrainz releases, retrieves their Cover
Art Archive metadata, and applies a weighted score for release type, original
date, cover dimensions and ratio, recording length, country and medium. It
queues the winning front image without replacing Picard's loaded metadata.
"""
